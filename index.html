<style>
  :root {
    --paper: #FFFEFA;
    --grid: #EEF1F6;
    --desk: #ECE8E0;
    --ink: #2E3440;
    --muted: #4C566A;
    --line: #E2E6EE;
    --dash: #B9C0CC;
    --red: #E8553E;
    --red-dark: #C94530;
    --coral: #CC4E33;
    --coral-soft: #FFE3DB;
    --yellow: #FFD35C;
    --yellow-soft: #FFF1C9;
    --mint: #3E9C7D;
    --mint-ink: #1F5C48;
    --mint-soft: #DDF3EA;
    --sky: #2F72C4;
    --sky-soft: #E3EEFC;
    --warn: #7A4E00;
    --pink: #C2335B;
  }
  * { box-sizing: border-box; }
  html { background: var(--desk); }
  body { margin: 0; font-family: 'Gowun Dodum', sans-serif; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  a { color: var(--sky); }
  .jua { font-family: 'Jua', sans-serif; font-weight: 400; }

  .app {
    position: relative; max-width: 480px; margin: 0 auto; min-height: 100vh;
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .app > * { position: relative; }
  .doodles { position: absolute !important; inset: 0; pointer-events: none; z-index: 0; }
  .doodles span { position: absolute; opacity: .5; }

  /* ---------- 홈: 빨간 색종이 머리 ---------- */
  .fhd { height: 196px; flex-shrink: 0; }
  .fhd .bg { position: absolute; inset: 0; background: var(--red); clip-path: polygon(0 0, 100% 0, 100% 78%, 0 100%); }
  .fhd .crease { position: absolute; inset: 0; background: linear-gradient(160deg, transparent 49.7%, rgba(255,255,255,.18) 49.7%, rgba(255,255,255,.18) 50.3%, transparent 50.3%); clip-path: polygon(0 0, 100% 0, 100% 78%, 0 100%); }
  .fhd .corner { position: absolute; right: 0; top: 0; width: 120px; height: 120px; background: linear-gradient(225deg, var(--paper) 50%, var(--red-dark) 50%); }
  .fhd .inner { position: relative; padding: 34px 20px 0; display: flex; align-items: flex-end; gap: 10px; }
  .fhd .txt { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .fhd .sub { font-size: 13px; color: #FFE1D9; }
  .fhd h1 { margin: 0; font-size: 42px; line-height: 1; color: #fff; }
  .fhd .char { width: 104px; height: 104px; object-fit: contain; margin-bottom: -30px; }

  .searchbox { position: relative; margin: 12px 20px 0; }
  .searchbox input { width: 100%; min-height: 48px; border-radius: 14px; border: 2px solid var(--line); background: #fff; padding: 0 46px 0 42px; font-size: 16px; font-family: inherit; color: var(--ink); -webkit-appearance: none; appearance: none; }
  .searchbox input:focus { outline: none; border-color: var(--ink); }
  .searchbox input::-webkit-search-cancel-button { display: none; }
  .searchbox .sicon2 { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); display: flex; pointer-events: none; }
  .searchbox .qclear { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: none; background: none; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .searchbox .qclear[hidden] { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .pickbtn { width: calc(100% - 40px); margin: 4px 20px 0; min-height: 52px; border-radius: 16px; border: none; background: var(--yellow); font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .tabs { margin: 14px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #fff; border-radius: 16px; border: 1.5px solid var(--line); }
  .tab { min-height: 50px; border-radius: 12px; border: none; background: transparent; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .tab .dots { font-size: 11px; letter-spacing: 2px; }
  .tab.on { background: var(--coral); color: #fff; font-family: 'Jua', sans-serif; font-size: 16px; }
  .tab.on .dots { color: #FFE3DB; }

  .homebar, .newbar, .notice { margin: 14px 20px 0; padding: 10px 8px 10px 14px; border-radius: 14px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .homebar { background: var(--sky-soft); color: #1F4677; }
  .newbar { background: var(--yellow-soft); color: var(--warn); }
  .notice { background: var(--yellow-soft); color: var(--warn); padding-right: 14px; line-height: 1.5; }
  .homebar .txt, .newbar .txt { flex: 1; font-weight: 700; }
  .homebar .txt { font-size: 13px; }
  .homebar .minibtn { padding: 0 4px; }
  .pill { font-size: 11px; font-weight: 700; color: #fff; background: var(--pink); border-radius: 10px; padding: 2px 8px; }
  .minibtn { border: none; background: none; font-size: 13px; min-height: 36px; padding: 0 8px; text-decoration: underline; color: inherit; }

  .views { margin: 14px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .view { min-height: 40px; border-radius: 12px; border: 2px dashed var(--dash); background: #fff; font-size: 14px; color: var(--muted); }
  .view.on { border: 2px solid var(--ink); background: var(--ink); color: #fff; }

  .sec { padding: 18px 20px 0; }
  .sec h2 { margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 19px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .count { font-size: 13px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 38px; padding: 0 14px; border-radius: 12px; border: 2px dashed var(--dash); background: #fff; font-size: 14px; }
  .chip.on { border: 2px solid #C98A00; background: var(--yellow-soft); color: var(--warn); }
  .chip.need { min-height: 36px; padding: 0 12px; border-radius: 18px; font-size: 13px; }
  .chip.need.on { border-color: var(--mint); background: var(--mint-soft); color: var(--mint-ink); }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
  .card { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 6px; border: none; background: #fff; text-align: left; font-size: inherit; box-shadow: 0 1px 2px rgba(46,52,64,.08); }
  .card.r0 { transform: rotate(-1deg); } .card.r1 { transform: rotate(1deg); } .card.r2 { transform: rotate(.8deg); } .card.r3 { transform: rotate(-.8deg); }
  .fold { position: absolute; z-index: 2; right: 0; top: 0; width: 22px; height: 22px; border-radius: 0 6px 0 0; }
  .fold.k0 { background: linear-gradient(225deg, var(--paper) 50%, #FFB3A1 50%); }
  .fold.k1 { background: linear-gradient(225deg, var(--paper) 50%, #9FD8C3 50%); }
  .fold.k2 { background: linear-gradient(225deg, var(--paper) 50%, #A9C9F5 50%); }
  .fold.k3 { background: linear-gradient(225deg, var(--paper) 50%, #FFD35C 50%); }
  .thumbwrap { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden; }
  .thumbwrap.c0 { background: var(--coral-soft); } .thumbwrap.c1 { background: var(--mint-soft); } .thumbwrap.c2 { background: var(--sky-soft); } .thumbwrap.c3 { background: var(--yellow-soft); }
  .thumbph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink); opacity: .4; }
  .thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumb.fail { display: none; }
  .badge { position: absolute; top: 6px; font-size: 11px; font-weight: 700; border-radius: 8px; padding: 2px 7px; }
  .badge.new { left: 6px; background: #D9483A; color: #fff; }
  .badge.fav { right: 6px; background: #fff; color: var(--pink); padding: 3px 5px; display: flex; }
  .donemark { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 700; color: var(--mint-ink); background: var(--mint-soft); border-radius: 8px; padding: 2px 7px; }
  .ytmark { position: absolute; right: 6px; bottom: 6px; font-size: 10px; color: #fff; background: rgba(46,52,64,.8); border-radius: 6px; padding: 1px 5px; }
  .lvl { font-size: 11px; letter-spacing: 1px; color: var(--coral); }
  .ctitle { font-family: 'Jua', sans-serif; font-size: 16px; line-height: 1.3; word-break: keep-all; }
  .cmeta { font-size: 12px; color: var(--muted); line-height: 1.4; }

  .empty { padding: 18px 16px 20px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; background: #fff; border-radius: 16px; border: 2px dashed var(--line); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .empty img { width: 92px; height: 92px; object-fit: contain; }
  .empty .minibtn { color: var(--sky); }

  .shopcard { margin: 22px 20px 0; padding: 14px; border-radius: 16px; background: #fff; border: 2px solid var(--yellow); display: flex; flex-direction: column; gap: 10px; }
  .disc { margin: 0; padding: 8px 10px; border-radius: 10px; background: var(--yellow-soft); color: var(--warn); font-size: 12px; line-height: 1.5; }
  .shopbtn { min-height: 50px; border-radius: 14px; background: var(--yellow); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-family: 'Jua', sans-serif; font-size: 17px; }

  .ft { margin-top: auto; padding: 28px 20px 22px; font-size: 11px; line-height: 1.7; color: var(--muted); }
  .ft p { margin: 0 0 6px; }
  .ft .links { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .ft a { color: var(--muted); }

  /* ---------- 아래에서 올라오는 창 ---------- */
  .layer { position: fixed; inset: 0; z-index: 60; background: rgba(46,52,64,.55); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; background: var(--paper); border-radius: 28px 28px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
  .sheet h2 { margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 23px; text-align: center; }
  .sheet p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); text-align: center; }
  .sheetchar { width: 110px; height: 110px; object-fit: contain; align-self: center; }
  .sheetbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sbtn { min-height: 50px; border-radius: 16px; border: 2px solid var(--line); background: #fff; font-size: 15px; }
  .sbtn.go { background: var(--yellow); border-color: var(--yellow); font-family: 'Jua', sans-serif; font-size: 17px; }
  .sclose { border: none; background: none; color: var(--muted); font-size: 14px; min-height: 40px; }
  .sheet .card { transform: none; }

  .quiz { font-family: 'Jua', sans-serif; font-size: 44px; text-align: center; }
  .answer { display: flex; justify-content: center; gap: 8px; }
  .answer span { width: 56px; height: 64px; border-radius: 14px; border: 2px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Jua', sans-serif; font-size: 30px; }
  .answer.bad span { border-color: #D9483A; }
  .msg { min-height: 20px; text-align: center; font-size: 13px; color: #B3361F; }
  .pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .key { min-height: 54px; border-radius: 14px; border: none; background: #F1EEE7; font-family: 'Jua', sans-serif; font-size: 24px; }
  .key.blank { visibility: hidden; }

  /* ---------- 영상 보기 ---------- */
  .ptop { padding: 12px 10px 0; display: flex; align-items: center; gap: 2px; }
  .iconbtn { width: 44px; height: 44px; flex-shrink: 0; border: none; background: none; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 12px; }
  .favbtn[aria-pressed="true"] { color: var(--pink); }
  .lockbtn { width: auto; padding: 0 10px; gap: 4px; font-size: 13px; background: var(--sky-soft); color: #1F4677; }
  .ptitle { flex: 1; margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 22px; line-height: 1.25; word-break: keep-all; }
  .pinfo { padding: 2px 20px 0 56px; font-size: 13px; color: var(--muted); }
  .playwrap { margin: 8px 16px 0; }
  .video { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #1C2230; border: 6px solid #fff; box-shadow: 0 1px 3px rgba(46,52,64,.15); }
  .video iframe, .video #yt { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .err { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #E2E8F5; font-size: 14px; text-align: center; padding: 20px; line-height: 1.5; }
  .err a { color: var(--yellow); }
  .vsub { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
  .src { font-size: 12px; color: var(--muted); padding-left: 4px; }
  .bigbtn { flex-shrink: 0; min-height: 36px; padding: 0 12px; border-radius: 18px; border: 2px dashed var(--dash); background: #fff; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .bigctrls { display: none; }

  .bar { position: relative; height: 8px; border-radius: 4px; background: #E6E2DA; overflow: hidden; }
  .bar .done { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #B9C0CC; }
  .bar .ab { position: absolute; top: 0; bottom: 0; width: 0; background: var(--yellow); }
  .bar .pos { position: absolute; top: 0; bottom: 0; width: 3px; left: 0; background: var(--ink); }
  .times { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .times .mid { color: var(--ink); font-weight: 700; text-align: center; }
  .ctrls { display: flex; justify-content: center; align-items: flex-start; gap: 22px; margin-top: 16px; }
  .cbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; border: none; background: none; font-size: 12px; padding: 0; min-width: 68px; }
  .cbtn .ic { width: 52px; height: 52px; border-radius: 26px; background: #fff; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; }
  .cbtn.main .ic { width: 72px; height: 72px; border-radius: 36px; background: var(--yellow); border: none; }
  .cbtn.rep .ic { background: var(--mint-soft); border-color: var(--mint); color: var(--mint-ink); }
  .cbtn.rep.on .ic { background: var(--mint); color: #fff; }
  .speeds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 16px; }
  .spd { min-height: 44px; border-radius: 12px; border: 2px dashed var(--dash); background: #fff; font-size: 14px; }
  .spd.on { border: 2px solid var(--coral); background: var(--coral); color: #fff; font-family: 'Jua', sans-serif; font-size: 16px; }
  .donebtn { width: 100%; margin-top: 16px; min-height: 50px; border-radius: 16px; border: 2px dashed var(--dash); background: #fff; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .donebtn[aria-pressed="true"] { border: 2px solid var(--mint); background: var(--mint-soft); color: var(--mint-ink); font-weight: 700; }

  .mats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .mat { padding: 10px 4px; border-radius: 12px; background: #fff; border: 2px solid var(--line); text-align: center; font-size: 13px; word-break: keep-all; }

  .items { margin-top: 10px; background: #fff; border-radius: 16px; padding: 12px 0 12px 12px; border: 2px solid var(--line); }
  .items .disc { margin: 0 12px 10px 0; }
  .ilist { display: flex; gap: 10px; overflow-x: auto; padding-right: 12px; scrollbar-width: none; }
  .ilist::-webkit-scrollbar { display: none; }
  .item { flex: 0 0 148px; display: flex; flex-direction: column; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; text-decoration: none; color: var(--ink); background: #fff; }
  .item .iimg { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--paper); display: block; }
  .item .iimg.fail { visibility: hidden; }
  .item .ibody { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; }
  .item .iname { font-size: 13px; font-weight: 700; line-height: 1.35; word-break: keep-all; }
  .item .idesc { font-size: 11px; color: var(--muted); line-height: 1.4; word-break: keep-all; }

  /* ---------- 아이 모드 ---------- */
  .kidbar { display: none; }
  body.kid .nk { display: none !important; }
  body.kid .kidbar { display: flex; margin: 12px 16px 0; padding: 10px 10px 10px 12px; border-radius: 16px; background: var(--sky-soft); align-items: center; gap: 10px; }
  .kidbar img { width: 44px; height: 44px; object-fit: contain; }
  .kidbar .txt { flex: 1; font-size: 14px; font-weight: 700; color: #1F4677; line-height: 1.4; }
  .kidbar button { min-height: 44px; padding: 0 12px; border-radius: 12px; border: 2px solid #9CB9E3; background: #fff; font-size: 13px; color: #1F4677; }
  body.kid .ctrls { margin-top: 20px; }

  /* ---------- 크게 보기 ----------
     유튜브 정책상 플레이어 위를 덮지 않고, 버튼은 영상 옆(가로) 또는 아래(세로)에 둡니다. */
  body.big { overflow: hidden; }
  body.big .playwrap { position: fixed; inset: 0; z-index: 40; margin: 0; background: #000; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  body.big .video { flex: 1; min-height: 0; aspect-ratio: auto; border: none; border-radius: 0; box-shadow: none; background: #000; }
  body.big .vsub { display: none; }
  body.big .bigctrls { display: flex; flex-shrink: 0; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 12px 12px 16px; background: #141820; }
  @media (orientation: landscape) {
    body.big .playwrap { flex-direction: row; }
    body.big .bigctrls { flex-direction: column; flex-wrap: nowrap; width: 132px; padding: 10px 8px; overflow-y: auto; }
    body.big .bcspeeds { display: grid; grid-template-columns: 1fr 1fr; }
  }
  .bc { min-width: 44px; min-height: 44px; border-radius: 22px; border: none; background: rgba(255,255,255,.14); color: #fff; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 12px; font-size: 13px; }
  .bc.main { background: var(--yellow); color: var(--ink); min-width: 56px; min-height: 56px; border-radius: 28px; }
  .bc.on { background: var(--yellow); color: var(--ink); font-weight: 700; }
  .bcspeeds { display: flex; gap: 4px; }
  .bcspeeds .bc { padding: 0 10px; }
  .bcab { color: #fff; font-size: 12px; text-align: center; }
  .bc.kidonly { display: none; }
  body.kid .bc.kidonly { display: flex; }

  /* ---------- 안내 페이지 ---------- */
  .page { padding: 4px 20px 0; line-height: 1.7; font-size: 15px; }
  .page h2 { margin: 22px 0 8px; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 20px; }
  .page p, .page ul, .page ol { margin: 0 0 10px; }
  .page ul, .page ol { padding-left: 22px; }
  .page li { margin-bottom: 4px; }
  .page .box { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  .page .box.hi { border-color: var(--yellow); }
  .page .tip { font-size: 13px; color: var(--muted); }
  .page .installbtn { width: 100%; min-height: 50px; border-radius: 16px; border: none; background: var(--yellow); font-family: 'Jua', sans-serif; font-size: 17px; margin-bottom: 12px; }

/* =========================================================
   도우미
   ========================================================= */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  text = String(text || '').replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function splitList(s) {
  return String(s || '').split(/[,，、\/]/).map(v => v.trim()).filter(Boolean);
}

function videoIdOf(url) {
  const s = String(url || '').trim();
  const m = s.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  return /^[A-Za-z0-9_-]{11}$/.test(s) ? s : '';
}

function safeLink(url) {
  const s = String(url || '').trim();
  return /^https:\/\//i.test(s) ? s : '';
}

function parseDate(s) {
  const m = String(s || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if (!m) return '';
  return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function daysBetween(a, b) {
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}

function tableOf(rows) {
  if (!rows.length) return [];
  const header = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const o = {};
    header.forEach((h, i) => { o[h] = (r[i] || '').trim(); });
    return o;
  });
}

function toFolds(rows) {
  const seen = new Set();
  return tableOf(rows).map(r => {
    const n = parseInt(String(r['색종이(장)'] || '').replace(/\D/g, ''), 10);
    return {
      id: videoIdOf(r['유튜브 주소']),
      title: r['이름'] || '',
      level: LEVELS.includes(r['난이도']) ? r['난이도'] : '보통',
      cats: splitList(r['주제']),
      sheets: Number.isFinite(n) && n > 0 ? n : 1,
      tools: splitList(r['필요한 것']),
      time: r['소요시간'] || '',
      channel: r['채널명'] || '',
      added: parseDate(r['추가일'])
    };
  }).filter(p => {
    if (!p.title || !p.id || seen.has(p.id)) return false;
    seen.add(p.id);
    return true;
  });
}

function toItems(rows) {
  return tableOf(rows).map(r => ({
    play: r['이름'] || r['놀이 이름'] || '',
    name: r['상품명'] || '',
    desc: r['한 줄 설명'] || '',
    img: safeLink(r['상품 이미지 주소']),
    link: safeLink(r['쿠팡 링크'])
  })).filter(it => it.play && it.name && it.link);
}

function fmt(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}

function charImg(key, cls) {
  const c = CHARS[key] || CHARS.bear;
  return `<img class="${cls}" src="${c.src}" alt="${esc(c.name)} 친구">`;
}

function isStandalone() {
  try {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  } catch (e) { return false; }
}

function deviceKind() {
  const ua = navigator.userAgent || '';
  if (/KAKAOTALK/i.test(ua)) return 'kakao';
  if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
  if (/Android/i.test(ua)) return 'android';
  return 'other';
}

function metaText(p) {
  return [p.time, p.sheets + '장', ...p.tools].filter(Boolean).join(' · ');
}

   목록 거르기
   ========================================================= */
function isNew(p) {
  if (!p.added) return false;
  const d = daysBetween(p.added, todayStr());
  return d >= 0 && d < CONFIG.NEW_DAYS;
}

function passNeeds(p) {
  if (state.needs.has('one') && p.sheets !== 1) return false;
  if (state.needs.has('noscissors') && p.tools.includes('가위')) return false;
  if (state.needs.has('noglue') && p.tools.includes('풀')) return false;
  return true;
}

function filterBy(level) {
  return state.plays.filter(p =>
    p.level === level &&
    (!state.cat || p.cats.includes(state.cat)) &&
    passNeeds(p) &&
    (state.view !== 'fav' || state.fav.has(p.id)) &&
    (state.view !== 'todo' || !state.done.has(p.id))
  );
}

function allCats() {
  const order = ['동물', '탈것', '꽃·식물', '놀잇감', '계절·행사'];
  const set = new Set();
  state.plays.forEach(p => p.cats.forEach(c => set.add(c)));
  return order.filter(c => set.has(c)).concat([...set].filter(c => !order.includes(c)));
}

function newInfo() {
  const news = state.plays.filter(isNew);
  const latest = news.reduce((m, p) => (p.added > m ? p.added : m), '');
  return { count: news.length, latest, show: news.length > 0 && latest > state.seenNew };
}

  if (!pool.length) pool = state.plays;
  const fresh = pool.filter(p => !state.done.has(p.id));
  return fresh.length ? fresh : pool;
}

function openPick() {
  const pool = pickPool();
  if (!pool.length) return;
  let next = pool[Math.floor(Math.random() * pool.length)];
  if (pool.length > 1 && state.picked && next.id === state.picked) {
    const rest = pool.filter(p => p.id !== state.picked);
    next = rest[Math.floor(Math.random() * rest.length)];

  state.picked = next.id;

function newQuiz() {
  const a = 2 + Math.floor(Math.random() * 8);
  const b = 2 + Math.floor(Math.random() * 8);
  state.quiz = { a, b, input: '' };
}

function openUnlock(message) {
  if (!state.quiz) newQuiz();
  const q = state.quiz;
  const ans = String(q.a * q.b);
  const boxes = [];
  for (let i = 0; i < ans.length; i++) boxes.push(`<span>${esc(q.input[i] || '')}</span>`);
  layerEl.innerHTML = `
    <div class="layer" data-layer data-kidlayer>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="아이 모드 풀기">
        <h2>엄마 아빠만 풀 수 있어요</h2>
        <p>아래 곱셈의 답을 눌러주세요</p>
        <div class="quiz">${q.a} × ${q.b} = ?</div>
        <div class="answer${message ? ' bad' : ''}">${boxes.join('')}</div>
        <div class="msg" role="status">${message ? esc(message) : ''}</div>
        <div class="pad">
          ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" class="key" data-key="${n}">${n}</button>`).join('')}
          <span class="key blank"></span>
          <button type="button" class="key" data-key="0">0</button>
          <button type="button" class="key" data-key="del" aria-label="지우기">${ICON.erase}</button>
        </div>
        <button type="button" class="sclose" data-close-layer>닫기</button>
      </div>
    </div>`;
}

function pressKey(k) {
  const q = state.quiz;
  if (!q) return;
  const ans = String(q.a * q.b);
  if (k === 'del') { q.input = q.input.slice(0, -1); openUnlock(); return; }
  if (q.input.length >= ans.length) return;
  q.input += k;
  if (q.input.length < ans.length) { openUnlock(); return; }
  if (q.input === ans) {
    kidOff();
    closeLayer();
  } else {
    newQuiz();
    openUnlock('다시 해볼까요? 문제가 바뀌었어요.');
  }
}

let ytApiPromise = null;
function loadYouTubeAPI() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise(resolve => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); resolve(); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
  return ytApiPromise;
}

function startPlayer(p) {
  player.reset();
  loadYouTubeAPI().then(() => {
    if (!document.getElementById('yt')) return;
    player.yt = new YT.Player('yt', {
      videoId: p.id,
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
      events: {
        onReady: e => { try { e.target.setPlaybackRate(player.speed); } catch (err) {} },
        onStateChange: e => { player.playing = e.data === YT.PlayerState.PLAYING; updateToggle(); },
        onError: () => showVideoError(p)
      }
    });
    player.timer = setInterval(tick, 250);
  });
}

function showVideoError(p) {
  const box = document.querySelector('.video');
  if (!box) return;
  exitBig();
  box.innerHTML = `<div class="err">이 영상은 앱 안에서 재생할 수 없어요.
    <a href="https://www.youtube.com/watch?v=${esc(p.id)}" target="_blank" rel="noopener">유튜브에서 보기</a></div>`;
  const bigbtn = document.querySelector('[data-big]');
  if (bigbtn) bigbtn.style.display = 'none';
}

function tick() {
  const yt = player.yt;
  if (!yt || !yt.getCurrentTime) return;
  const cur = yt.getCurrentTime() || 0;
  const dur = yt.getDuration ? (yt.getDuration() || 0) : 0;
  if (player.a != null && player.b != null && cur >= player.b) yt.seekTo(player.a, true);
  const pct = v => (dur ? Math.min(100, (v / dur) * 100) : 0) + '%';
  const done = document.getElementById('done');
  if (!done) return;
  done.style.width = pct(cur);
  document.getElementById('pos').style.left = pct(cur);
  document.getElementById('cur').textContent = fmt(cur);
  document.getElementById('dur').textContent = fmt(dur);
  const ab = document.getElementById('ab');
  if (player.a != null) {
    const end = player.b != null ? player.b : cur;
    ab.style.left = pct(player.a);
    ab.style.width = dur ? Math.max(0, ((end - player.a) / dur) * 100) + '%' : '0%';
  } else {
    ab.style.width = '0%';
  }
}

function updateToggle() {
  document.querySelectorAll('[data-toggle-ic]').forEach(el => { el.innerHTML = player.playing ? ICON.pause : ICON.play; });
  document.querySelectorAll('[data-toggle-label]').forEach(el => { el.textContent = player.playing ? '일시정지' : '재생'; });
}

function updateRepeatUI() {
  let label = '구간반복', text = '', on = false;
  if (player.a != null && player.b == null) {
    label = '끝점 지정'; on = true;
    text = '시작 ' + fmt(player.a) + ' · 끝점을 눌러주세요';
  } else if (player.a != null) {
    label = '반복 해제'; on = true;
    text = '구간반복 ' + fmt(player.a) + ' – ' + fmt(player.b);
  }
  document.querySelectorAll('[data-rep-btn]').forEach(b => b.classList.toggle('on', on));
  document.querySelectorAll('[data-rep-label]').forEach(el => { el.textContent = label; });
  document.querySelectorAll('[data-ab-text]').forEach(el => { el.textContent = text; });
}

function updateSpeedUI() {
  document.querySelectorAll('[data-speed]').forEach(b => {
    const on = Number(b.dataset.speed) === player.speed;
    b.classList.toggle('on', on);
    if (b.classList.contains('spd')) b.setAttribute('aria-pressed', on);
  });
}

/* ---------- 크게 보기 ---------- */
function enterBig() {
  document.body.classList.add('big');
  const wrap = document.getElementById('playwrap');
  try {
    if (wrap && wrap.requestFullscreen) {
      wrap.requestFullscreen().then(() => {
        try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
      }).catch(() => {});
    }
  } catch (e) {}
}

function exitBig() {
  if (!document.body.classList.contains('big')) return;
  document.body.classList.remove('big');
  try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {}
  try { screen.orientation.unlock(); } catch (e) {}
}

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && !state.kid) exitBig();
});

        <li>풀 때는 <b>뒤로 버튼과 최근 앱 버튼을 함께 길게</b> 눌러요. (제스처 사용 시 화면 아래에서 위로 밀어 올린 채 잠깐 기다려요)</li>
      </ol>
    </div>`;
  subPage('휴대폰 잠금 방법', `
    <p>앱 안의 <b>아이 모드</b>는 우리 앱의 버튼만 잠가요. 전화 걸기, 홈 버튼, 다른 앱으로 나가기까지 막으려면 휴대폰에 있는 잠금 기능을 같이 써주세요.</p>
    ${kind === 'android' ? android + ios : ios + android}
    <p class="tip">기종과 버전에 따라 메뉴 이름과 위치가 조금 다를 수 있어요. 설정 화면 위쪽 검색창에서 기능 이름으로 찾으면 빨라요.</p>`);
}

/* =========================================================
   화면 전환
   ========================================================= */
function route() {
  if (state.kid) {
    if (state.plays.some(p => p.id === state.kid)) {
      if (location.hash !== '#play/' + state.kid) { location.replace('#play/' + state.kid); return; }
    } else {
      kidOff();
    }
  }
  if (!layerEl.querySelector('[data-kidlayer]')) closeLayer();

  const h = location.hash;
  if (h === '#info') { player.reset(); renderInfo(); return; }
  if (h === '#guide-home') { player.reset(); renderGuideHome(); return; }
  if (h === '#guide-lock') { player.reset(); renderGuideLock(); return; }
  const m = h.match(/^#play\/([A-Za-z0-9_-]{11})$/);
  const p = m ? state.plays.find(x => x.id === m[1]) : null;
  if (p) renderPlayer(p);
  else { player.reset(); document.body.classList.remove('kid'); renderHome(); }
}

window.addEventListener('hashchange', route);

/* =========================================================
   썸네일·상품 이미지가 깨졌을 때
   ========================================================= */
document.addEventListener('error', e => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && (t.hasAttribute('data-thumb') || t.hasAttribute('data-itemimg'))) t.classList.add('fail');
}, true);
document.addEventListener('load', e => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.hasAttribute('data-thumb') && t.naturalWidth > 0 && t.naturalWidth <= 120) t.classList.add('fail');
}, true);

/* =========================================================
   버튼 동작
   ========================================================= */
document.addEventListener('click', e => {
  const sub = e.target.closest('a[data-sub]');
  if (sub) {
    if (state.kid) { e.preventDefault(); return; }
    returnHash = location.hash;
    closeLayer();
    return;
  }

  const t = e.target.closest('button, [data-layer]');
  if (!t) return;
  const d = t.dataset;
  if ('qclear' in d) { state.q = ''; renderHome(); const q = document.getElementById('q'); if (q) q.focus(); return; }

  if ('layer' in d) { if (e.target === t) closeLayer(); return; }
  if ('closeLayer' in d) { closeLayer(); return; }
  if ('repick' in d) { openPick(); return; }
  if (d.go) { closeLayer(); cameFromHome = true; location.hash = 'play/' + d.go; return; }
  if ('pick' in d) { openPick(); return; }
  if (d.key) { pressKey(d.key); return; }

  if ('lock' in d) { openLockSheet(); return; }
  if ('lockOn' in d) {
    const m = location.hash.match(/^#play\/([A-Za-z0-9_-]{11})$/);
    if (m) kidOn(m[1]);
    closeLayer();
    return;
  }
  if ('unlock' in d) { state.quiz = null; newQuiz(); openUnlock(); return; }
  if (state.kid && !('toggle' in d)) return;

  if (d.level) { state.level = d.level; save(); renderHome(); return; }
  if (d.view) { state.view = d.view; save(); renderHome(); return; }
  if (d.cat != null && !d.need) { state.cat = d.cat; save(); renderHome(); return; }
  if (d.need) { state.needs.has(d.need) ? state.needs.delete(d.need) : state.needs.add(d.need); save(); renderHome(); return; }
  if ('reset' in d) { state.cat = ''; state.needs.clear(); state.view = 'all'; save(); renderHome(); return; }
  if ('seenNew' in d) { state.seenNew = newInfo().latest; save(); renderHome(); return; }
  if ('closeHometip' in d) { state.homeTipClosed = true; save(); renderHome(); return; }
  if ('install' in d) {
    if (installPrompt) {
      installPrompt.prompt();
      installPrompt.userChoice.finally(() => { installPrompt = null; route(); });
    }
    return;
  }
  if (d.play) {
    if (layerEl.contains(t)) closeLayer();
    cameFromHome = true; location.hash = 'play/' + d.play; return;
  }

  if ('back' in d) {
    if (cameFromHome) { cameFromHome = false; history.back(); }
    else location.hash = '';
    return;
  }
  if ('subback' in d) {
    const to = returnHash; returnHash = '';
    location.hash = to && to !== location.hash ? to.replace(/^#/, '') : '';
    return;
  }

  if (d.fav) {
    const on = !state.fav.has(d.fav);
    on ? state.fav.add(d.fav) : state.fav.delete(d.fav);
    save();
    t.setAttribute('aria-pressed', on);
    t.innerHTML = on ? ICON.heartFill : ICON.heart;
    return;
  }
  if (d.done) {
    const on = !state.done.has(d.done);
    on ? state.done.add(d.done) : state.done.delete(d.done);
    save();
    t.setAttribute('aria-pressed', on);
    t.innerHTML = on ? ICON.check + '접어봤어요' : '다 접으면 눌러주세요 · 접어봤어요';
    return;
  }

  if ('big' in d) { enterBig(); return; }
  if ('unbig' in d) { exitBig(); return; }

  const yt = player.yt;
  if (!yt || !yt.getPlayerState) return;

  if ('rewind' in d) { yt.seekTo(Math.max(0, (yt.getCurrentTime() || 0) - 10), true); return; }
  if ('toggle' in d) {
    yt.getPlayerState() === YT.PlayerState.PLAYING ? yt.pauseVideo() : yt.playVideo();
    return;
  }
  if ('repeat' in d) {
    const cur = yt.getCurrentTime() || 0;
    if (player.a == null) player.a = cur;
    else if (player.b == null) {
      if (cur > player.a + 0.5) player.b = cur;
      else player.a = null;
    } else { player.a = null; player.b = null; }
    updateRepeatUI(); tick();
    return;
  }
  if (d.speed) {
    player.speed = Number(d.speed);
    yt.setPlaybackRate(player.speed);
    updateSpeedUI();
  }
});

/* =========================================================
   시작
   ========================================================= */
async function fetchCSV(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(res.status);
  return parseCSV(await res.text());
}

async function init() {
  renderHome();
  const tasks = [];
  if (CONFIG.SHEET_CSV_URL) {
    tasks.push(fetchCSV(CONFIG.SHEET_CSV_URL).then(rows => {
      const list = toFolds(rows);
      if (!list.length) throw new Error('empty');
      state.plays = list;
    }).catch(() => {
      state.loadError = true;
      state.plays = toFolds(parseCSV(SAMPLE_CSV));
    }));
  } else {
    state.plays = toFolds(parseCSV(SAMPLE_CSV));
  }
  if (CONFIG.ITEMS_CSV_URL) {
    tasks.push(fetchCSV(CONFIG.ITEMS_CSV_URL).then(rows => { state.items = toItems(rows); }).catch(() => {}));
  }
  await Promise.all(tasks);
  route();
}

init();
</script>
</body>
</html>
